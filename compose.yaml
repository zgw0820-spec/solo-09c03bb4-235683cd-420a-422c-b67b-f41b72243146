# 网关日志按月分区运维台：FastAPI + PostgreSQL 16
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_USER: ops
      POSTGRES_PASSWORD: ops
      POSTGRES_DB: gateway
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./db/init:/docker-entrypoint-initdb.d:ro   # 首次启动建表、预置旧月+本月分区和样例数据
      - ./db/samples:/samples:ro                   # 复位失败样例，手动执行，不会自动运行
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ops -d gateway"]
      interval: 2s
      timeout: 3s
      retries: 30
    ports:
      - "5432:5432"

  app:
    build: ./app
    environment:
      DATABASE_URL: postgresql://ops:ops@db:5432/gateway
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request;urllib.request.urlopen('http://localhost:8000/api/health')"]
      interval: 5s
      timeout: 3s
      retries: 30
    ports:
      - "8000:8000"

volumes:
  pgdata:
